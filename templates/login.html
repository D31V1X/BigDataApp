    <body>
        <heade class="bg primary text-white text-center py-5">
                       
            <div class =container>
                <h1 class="display-4">Proyecto Big Data Deivid Agudelo</h1>
                <nav>
                    <ul class="nav justify-content-center">

        </header>
        <div class="container">
            <div class="login-form mt-5">
                <h2 class="text-center">Iniciar Sesión</h2>
                {% if error_message %}
                    <div class="alert alert-danger" role="alert">
                        {{ error_message }}
                    </div>
                {% endif %}
            <form action="/login" method="POST" class="mt-5">
                <h1 style="color: #000000;">Iniciar Sesión</h1>
                <div class="mb-3">
                    <label for="username" class="form-label" style="color: #000000;">Usuario:</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" style="color: #000000;">Contraseña:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button><p></p>>
            </form>

            </div>

        <footer class="bg-light text-center text-lg-start">

            <p style="text-align: center;"><strong><span style="color: #000000;" id="current year"></span></strong></p>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <script>
            // Obtener el año actual

        </script>
