        </header>
        <div class="container">
            <form method="POST" class="mt-5">
                <h1>Contacto</h1>
                <div class="mb-3">
                    <label for="name" class="form-label" style="color: #000000;">Nombre:</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label" style="color: #000000;">Correo Electrónico:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label" style="color: #000000;">Mensaje:</label>
                    <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>







            </form>
